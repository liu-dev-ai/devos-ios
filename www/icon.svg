<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141f"/>
      <stop offset="0.55" stop-color="#0b0b13"/>
      <stop offset="1" stop-color="#060609"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#007aff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#007aff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#007aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#0060df"/>
    </linearGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>

  <!-- 中央光晕 -->
  <circle cx="512" cy="512" r="330" fill="url(#halo)"/>

  <!-- 四个 Agent 方块（菱形排列） -->
  <g>
    <!-- 上 -->
    <rect x="446" y="256" width="132" height="132" rx="40" fill="url(#tileGrad)"/>
    <rect x="446" y="256" width="132" height="132" rx="40" fill="url(#tileSheen)"/>
    <!-- 右 -->
    <rect x="636" y="446" width="132" height="132" rx="40" fill="url(#tileGrad)"/>
    <rect x="636" y="446" width="132" height="132" rx="40" fill="url(#tileSheen)"/>
    <!-- 下 -->
    <rect x="446" y="636" width="132" height="132" rx="40" fill="url(#tileGrad)"/>
    <rect x="446" y="636" width="132" height="132" rx="40" fill="url(#tileSheen)"/>
    <!-- 左 -->
    <rect x="256" y="446" width="132" height="132" rx="40" fill="url(#tileGrad)"/>
    <rect x="256" y="446" width="132" height="132" rx="40" fill="url(#tileSheen)"/>
  </g>

  <!-- 中心核心（主控/知识库） -->
  <circle cx="512" cy="512" r="120" fill="url(#coreGlow)" opacity="0.9"/>
  <circle cx="512" cy="512" r="46" fill="#ffffff"/>
  <circle cx="502" cy="500" r="14" fill="#dce9ff" opacity="0.9"/>
</svg>
