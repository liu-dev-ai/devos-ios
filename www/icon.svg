<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e36"/>
      <stop offset="0.5" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#5b7cfa" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#5b7cfa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5b7cfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4fe"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="dSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#2c3f8f" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- 蓝紫光晕 -->
  <circle cx="440" cy="512" r="390" fill="url(#glow)"/>

  <!-- D 字母（左侧竖条 + 右侧圆弧） -->
  <path d="M330 262 H402 A212 212 0 1 1 402 762 H330 Z" fill="url(#dGrad)"/>
  <path d="M330 262 H402 A212 212 0 1 1 402 762 H330 Z" fill="url(#dSheen)"/>

  <!-- 编辑器光标 -->
  <rect x="700" y="306" width="42" height="412" rx="21" fill="url(#cursorGrad)"/>
</svg>
