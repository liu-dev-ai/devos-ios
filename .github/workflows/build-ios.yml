name: Build DevOS iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets
        run: npx cap sync ios

      # 编译（不做签名，只生成 Release-iphoneos/App.app）
      - name: Build app (compile only)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 用 codesign 做 ad-hoc 签名（给 App 打上签名结构，供 Sideloadly/AltStore 重签）
      - name: Ad-hoc sign app
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          codesign --force --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -5 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -y DevOS.ipa Payload/
          ls -lh DevOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DevOS-ipa
          path: DevOS.ipa
          if-no-files-found: error
