name: Build DevOS iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets
        run: npx cap sync ios

      # 替换 App 主屏图标为 DevOS 新图标（D + 光标设计）
      - name: Replace app icons
        run: |
          cd ios/App/App/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          import json, os, subprocess, glob
          SRC = os.path.abspath('../../../../../../app-icon-1024.png')
          with open('Contents.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          for img in data.get('images', []):
              fn = img.get('filename')
              if not fn:
                  continue
              size = img.get('size', '1024x1024').split('x')
              scale = int(img.get('scale', '1x').replace('x', ''))
              px = int(size[0]) * scale
              out = os.path.join(os.getcwd(), fn)
              subprocess.run(['sips', '-z', str(px), str(px), SRC, '--out', out], check=True, capture_output=True)
              print('generated', fn, px, 'x', px)
          print('AppIcon replaced OK')
          PY

      # 编译（不做签名，只生成 Release-iphoneos/App.app）
      - name: Build app (compile only)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 用 codesign 做 ad-hoc 签名（给 App 打上签名结构，供 Sideloadly/AltStore 重签）
      - name: Ad-hoc sign app
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          codesign --force --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -5 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -y DevOS.ipa Payload/
          ls -lh DevOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DevOS-ipa
          path: DevOS.ipa
          if-no-files-found: error
